name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack replacement project if uploaded as ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'ChessOverlayAdvisor_FIXED.zip' -print -quit)"
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p /tmp/chess-overlay-project
            unzip -q "$ZIP_FILE" -d /tmp/chess-overlay-project
            cp -a /tmp/chess-overlay-project/. .
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChessOverlayAdvisor-APK-v1.1
          path: app/build/outputs/apk/debug/app-debug.apk
